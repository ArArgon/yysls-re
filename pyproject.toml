[project]
name = "messiah"
version = "0.1.0"
description = "Reader and decoder for the Messiah engine's MPK asset/patch filesystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mmh3",
    "msgpack",
    "pycryptodome",
    "zstandard",
]

[project.optional-dependencies]
# Only needed to regenerate a Kaitai parser from ksy/mpkinfo.ksy.
kaitai = ["kaitaistruct"]
# Only needed for runtime instrumentation (messiah.frida).
instrument = ["frida"]

[project.scripts]
messiah-inventory = "messiah.cli.inventory:main"
messiah-build-index = "messiah.cli.build_index:main"
messiah-extract = "messiah.cli.extract:main"
messiah-extract-luatext = "messiah.cli.extract_luatext:main"
messiah-hd-query = "messiah.cli.hd_query:main"
messiah-luac = "messiah.cli.luac:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messiah"]

[tool.hatch.build.targets.wheel.force-include]
# dump_lua.js is a resource inside the package, not a module.
"src/messiah/frida/dump_lua.js" = "messiah/frida/dump_lua.js"
